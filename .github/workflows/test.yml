name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - v4.0.x

jobs:
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          # Same toolchain as the release build (scripts/build-security-release.sh).
          go-version: '1.25.14'
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: make test-cover
      - name: Passage tests of the vendored iavl-fork and Amino JSON signing
        run: make test-forks
      - name: Upload codecov report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.txt
        continue-on-error: true

  upgrade:
    name: In-place upgrade from the mainnet release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: upgrade test (docker)
        run: make test-upgrade
