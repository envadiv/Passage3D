name: Protobuf
# buf (https://buf.build/) lint and breaking-change check, on pull requests changing protobuf files.
on:
  pull_request:
    paths:
      - "**.proto"
      - "proto/buf.*"
      - "buf.work.yaml"
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: lint
        run: make proto-lint
  breakage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: check-breakage against the pull request base
        run: make proto-check-breaking PROTO_BREAKING_AGAINST='https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }},subdir=proto'
