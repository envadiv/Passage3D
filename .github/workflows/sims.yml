name: Sims
# Application simulations (app/sim_test.go): full app, import/export, after-import
# and non-determinism. Run on pull requests touching Go code and nightly.
on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

env:
  SIM_NUM_BLOCKS: 100
  SIM_BLOCK_SIZE: 50

jobs:
  sims:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: "!contains(github.event.head_commit.message, 'skip-sims')"
    strategy:
      fail-fast: false
      matrix:
        target:
          - test-sim-full
          - test-sim-import-export
          - test-sim-after-import
          - test-sim-nondeterminism
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
      - name: ${{ matrix.target }}
        run: make ${{ matrix.target }}
