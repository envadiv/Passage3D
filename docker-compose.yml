# 4-validator Passage localnet. Use the Makefile:
#   make localnet-start   # build image passage:local, generate ./mytestnet (once), start
#   make localnet-stop
#   make localnet-clean   # remove ./mytestnet
#
# Node home directories are generated by `passage testnet` into ./mytestnet.
# Host ports: node0 26657/1317/9090, node1 +10, node2 +20, node3 +30.

x-passage-node: &passage-node
  image: ${PASSAGE_IMAGE:-passage:local}
  command: ["passage", "start", "--home", "/root/.passage"]
  restart: "no"

services:
  passagenode0:
    <<: *passage-node
    container_name: passagenode0
    ports:
      - "26656-26657:26656-26657"
      - "1317:1317"
      - "9090:9090"
    volumes:
      - ./mytestnet/passagenode0/passage:/root/.passage
    networks:
      localnet:
        ipv4_address: 192.168.10.2

  passagenode1:
    <<: *passage-node
    container_name: passagenode1
    ports:
      - "26666-26667:26656-26657"
      - "1327:1317"
      - "9100:9090"
    volumes:
      - ./mytestnet/passagenode1/passage:/root/.passage
    networks:
      localnet:
        ipv4_address: 192.168.10.3

  passagenode2:
    <<: *passage-node
    container_name: passagenode2
    ports:
      - "26676-26677:26656-26657"
      - "1337:1317"
      - "9110:9090"
    volumes:
      - ./mytestnet/passagenode2/passage:/root/.passage
    networks:
      localnet:
        ipv4_address: 192.168.10.4

  passagenode3:
    <<: *passage-node
    container_name: passagenode3
    ports:
      - "26686-26687:26656-26657"
      - "1347:1317"
      - "9120:9090"
    volumes:
      - ./mytestnet/passagenode3/passage:/root/.passage
    networks:
      localnet:
        ipv4_address: 192.168.10.5

networks:
  localnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.10.0/24
